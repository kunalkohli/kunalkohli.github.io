  <div class="m365-live-commentary" hidden><span class="m365-beat-number" data-m365-beat-number>01</span><p data-m365-beat-text>Press Play all to follow the request.</p></div>

  <div class="m365-scenes">
    <section class="m365-scene" id="m365-scene-0" data-m365-scene>
      <div class="m365-static-route"><span>You open Outlook</span><b>→</b><span>Gateway accepts request</span><b>→</b><strong>Inbox loads ✓</strong></div>
      <div class="m365-scene-caption"><span>01 / WHAT NORMALLY HAPPENS</span><h3>You open Outlook. Your inbox loads.</h3><p>Your app asks Microsoft for your mail. A connection gateway—the front door—lets that request reach Exchange Online. Your mailbox responds and Outlook displays your inbox. This is the successful journey the outage interrupted.</p></div>
    </section>
    <section class="m365-scene" id="m365-scene-1" data-m365-scene>
      <div class="m365-static-route"><span>You can still read mail</span><b>←</b><span>Gateway now also carries Teams traffic</span><b>←</b><strong>Teams switches paths</strong></div>
      <div class="m365-scene-caption"><span>02 / YOU DO NOT NOTICE THE CHANGE YET</span><h3>Your mail still works, but the entrance gets busier.</h3><p>At 01:07 UTC on 12 November, a routing problem in US East sends Teams traffic worldwide onto the gateway also serving Exchange. A shift like this is normally safe. Broad mail failures come hours later, near North America's daily peak—not at the instant of failover.</p></div>
    </section>
    <section class="m365-scene" id="m365-scene-2" data-m365-scene>
      <div class="m365-static-route"><span>You open Outlook</span><b>→</b><span>Connection processing gets stuck ×</span><b>→</b><strong>No mailbox response reaches you</strong></div>
      <div class="m365-scene-caption"><span>03 / NOW YOUR INBOX WILL NOT LOAD</span><h3>Your request reaches the front door—and stalls.</h3><p>Peak load, shifted Teams traffic, and reduced gateway capacity expose a July connection-handling defect on newer servers. Requests compete for a shared resource until servers stop responding. You see a failed or waiting connection, not a deleted mailbox.</p></div>
    </section>
    <section class="m365-scene" id="m365-scene-3" data-m365-scene>
      <div class="m365-static-route"><span>You keep waiting</span><b>←</b><span>Traffic tries another server</span><b>→</b><strong>Same defect, extra load ×</strong></div>
      <div class="m365-scene-caption"><span>04 / THE BACKUP DOES NOT SAVE THIS REQUEST</span><h3>Microsoft tries another server. That one can fail too.</h3><p>Traffic management sends connections to healthier capacity units in the same region. Those units have the same hidden defect and now absorb more work. More servers stop responding, so your mailbox is still hard to reach. The North American low point exceeds 80% of gateway servers unresponsive.</p></div>
    </section>
    <section class="m365-scene" id="m365-scene-4" data-m365-scene>
      <div class="m365-static-route"><span>You still cannot load mail</span><b>←</b><span>Connections move to other regions</span><b>→</b><strong>Same defect is there too ×</strong></div>
      <div class="m365-scene-caption"><span>05 / PEOPLE ELSEWHERE START SEEING PROBLEMS</span><h3>A different region has the same hidden problem.</h3><p>When regional capacity runs short, connections move to other regions whose gateways carry the same regression. Within about two hours of broad North American failures, servers in every region are affected. This does not mean every server or every user's request failed.</p></div>
    </section>
    <section class="m365-scene" id="m365-scene-5" data-m365-scene>
      <div class="m365-static-route"><span>Servers repaired away from traffic</span><b>→</b><span>Your connection gets through again</span><b>→</b><strong>Your inbox returns ✓</strong></div>
      <div class="m365-scene-caption"><span>06 / YOU CAN REACH YOUR MAIL AGAIN</span><h3>The repaired gateway lets your request through.</h3><p>Microsoft removes groups of capacity units from traffic, restarts failed servers, applies the corrective update, restarts again, and returns them to service. The first update is applied at 07:20 UTC on 13 November. Global webmail availability is normal at 14:17; active impact ends at 16:10. Delayed-mail processing and monitoring continue.</p></div>
    </section>
  </div>
